# 제품 릴스 설정 견본 — 자리표시자(<…>)를 자기 제품으로 바꿔 캠페인 폴더(deliverables/content/<건명>/)에 reel.yaml로 저장
# 자막·컷은 02_자막카피.md와 03_콘티를 정본으로 옮겨 적는다. 사람 승인 전 generate·replace는 --yes 없이 비용만 확인

name: <제품>_릴스_15초
out_dir: 영상_auto
size: [1080, 1920]
fps: 24
duration: 15

package:
  cutout: assets/package_cutout.png          # 투명 배경 패키지 누끼 (reel.py cutout으로 생성). 목업이면 연출 고지 필수
  describe: "<패키지 생김새를 영어로. 예: a stand-up pouch with a white upper part and green lower band, brand logo at top left, product name on the band, white cap>"
  notice: "AI 생성 연출 · 패키지 이미지 예시"
  integrity: "Package integrity: keep the exact package shape and print from the attached cutout. Exactly one <spout/cap/lid> where the real package has it. No second cap, no extra parts, no distorted letters."
  notice_mode: end_small                      # end_small(끝 화면 구석 작은 글씨, 기본) | full(전 구간) | none
  base_y: 1240                                # 합성 패키지 아래 끝 y (안전 영역 하단 1248 안)

style:
  preamble_frame: "Vertical 9:16 still photograph. <장소·조명·색감을 영어로. 예: clean bright kitchen, soft daylight, calm mood>. Keep the upper 40% of the frame calm and uncluttered. No on-screen text, no captions, no logos other than the package print."
  preamble_video: "Soft natural light, gentle film-like color, subtle handheld camera feel, calm everyday mood."
  person: "<사람이 나오면 범위를 영어로. 예: only hands and forearms; the face is never shown>"
  avoid: "face, extra text, distorted package print, distorted hands, extra fingers, several packages, opened package unless scripted"

clips:                                         # 각 클립 = 첫 프레임(frames/<ID>.png) → image-to-video 5초
  V1:
    frame: "<첫 프레임 장면을 영어로. 제품이 나오면 'the attached package' 로 지칭>"
    motion: "<5초 동안의 움직임을 영어로>"
  V2:
    frame: "<두 번째 장면>"
    motion: "<움직임>"

generate:
  model: kling3_0
  mode: pro
  duration: 5
  replace_resolution: 1080p

budget:
  max_credits: 30                              # 이 값을 넘는 생성은 중단. 사람 승인 뒤에만 올림

background:                                    # 정지 합성 컷 배경 (없으면 still:bg 컷을 쓰지 않는다)
  image: assets/bg.png
  prompt: "<빈 배경 장면을 영어로. 제품이 없는 화면>"
  scale: 1.3
  table_y: 1280
  target_y: 1120
  pouch_h: 480

endcard:
  color: "#F3F1EC"
  pouch_h: 620

captions:                                      # 02_자막카피.md 확정 문구를 글자 그대로. 원본 카피만, 새 문장 0
  # 포함 서체: assets/fonts/MaruBuri-SemiBold.ttf / Jua-Regular.ttf / GmarketSansTTFBold.ttf
  # 위키 루트 기준 경로 사용 가능. TTF를 고르면 font_index는 light/regular/bold 모두 0
  font: /System/Library/Fonts/AppleSDGothicNeo.ttc
  font_index: {light: 8, regular: 0, bold: 6}
  y: {lead: 380, head: 467, body: 573}
  blocks:
    - {start: 0,  end: 3,  lead: "<원본 리드 문장>", head: "<제품명>"}
    - {start: 3,  end: 6,  head: "<원본 헤드 문장>", body: "<원본 본문 문장>"}
    - {start: 6,  end: 12, head: "<함량·구성 등 제품 정보>"}
    - {start: 12, end: 15, head: "<제품명>", panel: false}

cuts:                                          # [컷, 길이, 소스, in초, 펀치인, 중심x, 중심y] / 정지: [컷, 길이, still:bg|still:end, null, 푸시 끝 배율]
  - [K01, 1.0, V1, 0.10, 1.00, 540, 960]
  - [K02, 1.0, V1, 1.50, 1.20, 540, 1000]
  - [K03, 1.0, V1, 3.00, 1.00, 540, 960]
  - [K04, 1.0, V2, 0.10, 1.00, 540, 960]
  - [K05, 1.0, V2, 1.50, 1.20, 540, 1000]
  - [K06, 1.0, V2, 3.00, 1.00, 540, 960]
  - [K07, 1.0, "still:bg", null, 1.03]
  - [K08, 1.0, V1, 4.00, 1.10, 540, 960]
  - [K09, 1.0, V2, 4.00, 1.10, 540, 960]
  - [K10, 1.0, "still:bg", null, 1.05]
  - [K11, 1.0, V1, 2.50, 1.00, 540, 960]
  - [K12, 2.0, "still:end", null, 1.03]

bgm:
  bpm: 110
  progression: [C, G, Am, F]
  accents: [3, 6, 12]                          # 자막 블록 전환 시각
  # file: audio/라이선스_음원.wav               # 음원을 지정하면 합성 대신 사용
