interface:
  display_name: "콘텐츠 기획 인터뷰"
  short_description: "콘텐츠 인터뷰·조회수 기반 이벤트 기획과 채널별 썸네일 변주"
  default_prompt: "$content-interview로 미정 항목을 인터뷰하고 답변을 반영해 콘텐츠 세트를 기획해줘. 이벤트 요청이면 원본 조회수와 행사 자산을 비교해 혜택 후보·비용·운영안도 제안하고, 썸네일 요청이면 채널별로 구별되는 디자인 방향과 비교 미리보기를 구성해줘."
policy:
  allow_implicit_invocation: true
