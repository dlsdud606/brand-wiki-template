<!-- 랜딩 01 히어로 (가로 1000, 높이는 출력 size). 슬롯: badge, sub, head, benefit, period, body. 자산: pack -->
<!doctype html><html lang="ko"><meta charset="utf-8"><title>{{id}}</title><style>*{box-sizing:border-box}body{margin:0}.c{position:relative;width:{{w}}px;height:{{h}}px;overflow:hidden;font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#1f1f1f;word-break:keep-all}.badge{display:inline-block;color:#fff;font-weight:800;font-size:30px;border-radius:12px;padding:8px 22px;background:linear-gradient(90deg,#FE8536,#F05656)}.sub{font-size:34px;font-weight:600;color:#444}.head{font-size:64px;font-weight:900;letter-spacing:-1.5px;line-height:1.22}.body{font-size:32px;line-height:1.6;color:#3a3a3a}.pack{position:absolute;filter:drop-shadow(0 22px 26px rgba(60,40,30,.22))}.notice{position:absolute;right:40px;bottom:24px;font-size:22px;font-weight:600;color:#3d3d3d;background:rgba(255,255,255,.8);border-radius:6px;padding:2px 10px}.ctr{position:absolute;left:80px;right:80px;text-align:center}.btn{display:inline-block;margin-top:36px;padding:22px 90px;border-radius:44px;background:#2F6B45;color:#fff;font-size:34px;font-weight:800}
.c{background:linear-gradient(180deg,#BFEAFB 0%,#D8F6FE 58%,#EAF9FF 100%)}
.hill{position:absolute;left:-200px;right:-200px;top:780px;height:500px;border-radius:50% 50% 0 0/160px 160px 0 0;background:linear-gradient(180deg,#7CCB55,#6CC048)}
.cloud{position:absolute;background:#fff;border-radius:50%;opacity:.95}
.txt{position:absolute;left:80px;top:110px;width:520px}
.txt .sub{margin-top:30px}.txt .head{margin-top:10px;font-size:76px}
.benefit{margin-top:22px;font-size:46px;font-weight:900;color:#F05656}
.period{display:inline-block;margin-top:18px;font-size:28px;font-weight:700;color:#F05656;background:#fff;border:2px solid #F7C2B8;border-radius:30px;padding:8px 24px}
.txt .body{margin-top:30px}
.pack{left:590px;top:190px;height:640px}
</style><div class="c"><div class="cloud" style="left:820px;top:30px;width:260px;height:96px"></div><div class="hill"></div>
<div class="txt"><span class="badge">{{badge}}</span><div class="sub">{{sub}}</div><div class="head">{{head}}</div><div class="benefit">{{benefit}}</div><div class="period">{{period}}</div><div class="body">{{body}}</div></div>
{{packs_html}}<div class="notice">{{notice}}</div></div></html>
