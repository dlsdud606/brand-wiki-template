<!-- 자사몰 모바일 메인 720×700 · 배경 사진. 슬롯: badge, subl, head1, head2, chip. 자산: bg(잘라 쓸 배경), pack -->
<!doctype html><html lang="ko"><meta charset="utf-8"><title>{{id}}</title><style>*{box-sizing:border-box}body{margin:0}.c{position:relative;width:720px;height:700px;overflow:hidden;font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#1f1f1f;word-break:keep-all}.top{position:absolute;left:40px;top:58px;display:flex;align-items:center;gap:16px}.badge{color:#fff;font-weight:800;font-size:30px;border-radius:12px;padding:8px 20px;background:linear-gradient(90deg,#FE8536,#F05656)}.subl{font-size:26px;color:#333}.head{position:absolute;left:40px;top:128px;font-size:41px;font-weight:800;line-height:1.38;letter-spacing:-1px}.head b{font-weight:900}.chip{position:absolute;left:40px;top:262px;font-size:22px;font-weight:700;color:#F05656;background:#fff;border:2px solid #F7C2B8;border-radius:22px;padding:6px 18px}.pack{position:absolute;filter:drop-shadow(0 18px 22px rgba(60,40,30,.25))}.notice{position:absolute;right:18px;bottom:14px;font-size:20px;font-weight:600;color:#3d3d3d;background:rgba(255,255,255,.75);border-radius:6px;padding:2px 8px}
.c{background:url("../assets/{{asset_bg}}") center/cover}
.pack{left:440px;top:296px;height:340px;filter:drop-shadow(0 14px 16px rgba(60,40,30,.28))}
{{packs_css}}</style><div class="c">
{{#badge}}<div class="top"><span class="badge">{{badge}}</span><span class="subl">{{subl}}</span></div>
{{/badge}}<div class="head">{{head1}}<br><b>{{head2}}</b></div>
{{#chip}}<div class="chip">{{chip}}</div>
{{/chip}}{{packs_html}}<div class="notice">{{notice}}</div></div></html>
