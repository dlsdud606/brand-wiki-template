<!-- 자사몰 팝업 400×476. 슬롯: badge, sub, head, benefit, aux, button, legal. 자산: pack -->
<!doctype html><html lang="ko"><meta charset="utf-8"><title>{{id}}</title><style>
*{box-sizing:border-box}body{margin:0}
.c{position:relative;width:400px;height:476px;overflow:hidden;font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#1f1f1f;word-break:keep-all;text-align:center;background:linear-gradient(180deg,#BFEAFB 0%,#D8F6FE 58%,#EAF9FF 100%)}
.hill{position:absolute;left:-80px;right:-80px;top:300px;height:220px;border-radius:50% 50% 0 0/70px 70px 0 0;background:linear-gradient(180deg,#7CCB55,#6CC048)}
.badge{position:absolute;left:0;right:0;top:18px}.badge span{display:inline-block;color:#fff;font-weight:800;font-size:14px;border-radius:8px;padding:5px 12px;background:linear-gradient(90deg,#FE8536,#F05656)}
.sub{position:absolute;left:0;right:0;top:54px;font-size:15px;font-weight:600;color:#333}
.head{position:absolute;left:0;right:0;top:76px;font-size:27px;font-weight:900;letter-spacing:-.5px}
.benefit{position:absolute;left:0;right:0;top:114px;font-size:36px;font-weight:900;color:#F05656;letter-spacing:-1px}
.pack{position:absolute;left:50%;transform:translateX(-50%);top:166px;height:178px;filter:drop-shadow(0 10px 12px rgba(60,40,30,.25))}
.aux{position:absolute;left:20px;right:20px;top:350px;font-size:14px;font-weight:600;color:#2b2b2b;background:rgba(255,255,255,.85);border-radius:8px;padding:4px 8px}
.btn{position:absolute;left:40px;right:40px;top:384px;height:42px;border-radius:21px;background:#2F6B45;color:#fff;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center}
.legal{position:absolute;left:10px;right:10px;top:430px;font-size:12px;font-weight:600;color:#1f3a28;line-height:1.3}
.notice{position:absolute;left:0;right:0;top:455px;font-size:12px;font-weight:700;color:#1f3a28}
</style><div class="c"><div class="hill"></div>
<div class="badge"><span>{{badge}}</span></div><div class="sub">{{sub}}</div><div class="head">{{head}}</div><div class="benefit">{{benefit}}</div>
{{packs_html}}<div class="aux">{{aux}}</div><div class="btn">{{button}}</div>
<div class="legal">{{legal}}</div><div class="notice">{{notice}}</div></div></html>
