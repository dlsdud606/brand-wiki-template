<!-- 상품 목록 세트 썸네일 1000×1000 · 나란히 + 글자 라벨. 슬롯: label. 자산: pack(3개, 왼쪽부터) -->
<!doctype html><html lang="ko"><meta charset="utf-8"><title>{{id}}</title><style>*{box-sizing:border-box}body{margin:0}.c{position:relative;width:1000px;height:1000px;overflow:hidden;font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif}.pack{position:absolute;display:block}
.c{background:#fff}
.label{position:absolute;left:0;right:0;top:250px;display:flex;align-items:center;justify-content:center;gap:22px;color:#503629;font-size:42px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}.label:before,.label:after{content:'';width:120px;height:2px;background:#503629;opacity:.55}
.pack{top:362px;height:400px;filter:drop-shadow(0 8px 14px rgba(60,60,80,.12))}
.p1{left:38px}.p2{left:50%;transform:translateX(-50%)}.p3{right:38px}
</style><div class="c">
<div class="label">{{label}}</div>
{{packs_html}}
</div></html>
