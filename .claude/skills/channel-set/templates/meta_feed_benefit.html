<!-- 메타 피드 4:5 · 혜택 중심. 슬롯: badge, sub, head, under. 자산: pack -->
<!doctype html><html lang="ko"><meta charset="utf-8"><title>{{id}}</title><style>*{box-sizing:border-box}body{margin:0}.c{position:relative;width:1440px;height:1800px;overflow:hidden;font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#1f1f1f;word-break:keep-all}.badge{display:inline-block;color:#fff;font-weight:800;border-radius:18px;background:linear-gradient(90deg,#FE8536,#F05656)}.notice{position:absolute;right:56px;bottom:40px;font-size:26px;color:rgba(40,40,40,.55)}.pack{position:absolute;filter:drop-shadow(0 26px 30px rgba(60,40,30,.22))}.txt{position:absolute;left:0;right:0;text-align:center}
.c{background:#FFF4F2}
.panel{position:absolute;left:90px;right:90px;top:120px;height:820px;border-radius:48px;background:#fff;box-shadow:0 18px 40px rgba(240,86,86,.12)}
.txt{top:200px}.badge{font-size:44px;padding:16px 40px}
.sub{margin-top:50px;font-size:62px;font-weight:700;color:#2b2b2b}
.head{margin-top:10px;font-size:150px;font-weight:900;letter-spacing:-4px;color:#F05656;line-height:1.05}
.under{margin-top:30px;font-size:60px;font-weight:700;color:#444}
.pack{left:50%;transform:translateX(-50%);top:1010px;height:700px}
{{packs_css}}</style><div class="c"><div class="panel"></div>
<div class="txt"><span class="badge">{{badge}}</span><div class="sub">{{sub}}</div><div class="head">{{head}}</div><div class="under">{{under}}</div></div>
{{packs_html}}<div class="notice">{{notice}}</div></div></html>
