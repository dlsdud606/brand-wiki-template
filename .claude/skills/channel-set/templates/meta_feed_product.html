<!-- 메타 피드 4:5 · 제품 중심. 슬롯: badge, sub, head, under. 자산: pack(1개 또는 여러 개) -->
<!doctype html><html lang="ko"><meta charset="utf-8"><title>{{id}}</title><style>*{box-sizing:border-box}body{margin:0}.c{position:relative;width:1440px;height:1800px;overflow:hidden;font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#1f1f1f;word-break:keep-all}.badge{display:inline-block;color:#fff;font-weight:800;border-radius:18px;background:linear-gradient(90deg,#FE8536,#F05656)}.notice{position:absolute;right:56px;bottom:40px;font-size:26px;color:rgba(40,40,40,.55)}.pack{position:absolute;filter:drop-shadow(0 26px 30px rgba(60,40,30,.22))}.txt{position:absolute;left:0;right:0;text-align:center}
.c{background:linear-gradient(180deg,#BFEAFB 0%,#D8F6FE 52%,#EAF9FF 100%)}
.hill{position:absolute;left:-200px;right:-200px;top:1290px;height:700px;border-radius:50% 50% 0 0/180px 180px 0 0;background:linear-gradient(180deg,#7CCB55,#6CC048)}
.cloud{position:absolute;background:#fff;border-radius:50%;opacity:.95}
.txt{top:150px}.badge{font-size:44px;padding:16px 40px}
.sub{margin-top:44px;font-size:58px;font-weight:600;color:#2b2b2b}
.head{margin-top:14px;font-size:96px;font-weight:900;letter-spacing:-2px}
.under{margin-top:26px;font-size:60px;font-weight:800;color:#F05656}
.pack{left:50%;transform:translateX(-50%);top:720px;height:960px}
{{packs_css}}</style><div class="c">
<div class="cloud" style="left:-80px;top:560px;width:300px;height:130px"></div><div class="cloud" style="right:-60px;top:620px;width:320px;height:140px"></div>
<div class="hill"></div>
<div class="txt">{{#badge}}<span class="badge">{{badge}}</span>{{/badge}}<div class="sub">{{sub}}</div><div class="head">{{head}}</div>{{#under}}<div class="under">{{under}}</div>{{/under}}</div>
{{packs_html}}<div class="notice">{{notice}}</div></div></html>
