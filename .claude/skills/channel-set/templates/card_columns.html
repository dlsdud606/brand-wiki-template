<!-- 인스타 카드뉴스 맛별 비교 1080×1350. 슬롯: page, label, head, columns([패키지 자산, 이름, 열량, [항목]]), note1, note2. 자산: logo -->
<!doctype html><html lang="ko"><meta charset="utf-8"><title>{{id}}</title><link rel="stylesheet" href="../assets/card.css"><style>
.top{position:absolute;left:64px;right:64px;top:150px}.top .head{margin-top:26px;font-size:64px}
.cols{position:absolute;left:44px;right:44px;top:440px;display:flex;gap:20px}
.col{flex:1;background:#fff;border-radius:28px;padding:26px 20px 30px;text-align:center;box-shadow:0 8px 20px rgba(80,54,41,.06)}
.col img{height:300px;filter:drop-shadow(0 12px 14px rgba(70,60,40,.15))}
.col b{display:block;margin-top:16px;font-size:36px;color:#503629}
.col .kcal{margin-top:6px;font-size:26px;color:#8a8079}
.col ul{list-style:none;margin:20px 0 0;padding:0;text-align:left;font-size:27px;line-height:1.55;color:#4a403a}
.col li{border-top:1px solid #EFE6DC;padding:8px 2px}
.c1 b{color:#E06A2B}.c2 b{color:#4F8F2E}.c3 b{color:#6B4FA0}
</style><div class="c"><img class="logo" src="../assets/{{asset_logo}}"><div class="page">{{page}}</div>
<div class="top"><span class="label">{{label}}</span><div class="head">{{head}}</div></div>
<div class="cols">
{{columns_html}}</div>
<div class="note">{{note1}}<br>{{note2}} · {{notice}}</div></div></html>
