<!-- 랜딩 04 혜택. 슬롯: badge, sub, head, body, price_regular·price_sale(확정 전이면 비움 → 입력란), button. 자산: pack -->
<!doctype html><html lang="ko"><meta charset="utf-8"><title>{{id}}</title><style>*{box-sizing:border-box}body{margin:0}.c{position:relative;width:{{w}}px;height:{{h}}px;overflow:hidden;font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#1f1f1f;word-break:keep-all}.badge{display:inline-block;color:#fff;font-weight:800;font-size:30px;border-radius:12px;padding:8px 22px;background:linear-gradient(90deg,#FE8536,#F05656)}.sub{font-size:34px;font-weight:600;color:#444}.head{font-size:64px;font-weight:900;letter-spacing:-1.5px;line-height:1.22}.body{font-size:32px;line-height:1.6;color:#3a3a3a}.pack{position:absolute;filter:drop-shadow(0 22px 26px rgba(60,40,30,.22))}.notice{position:absolute;right:40px;bottom:24px;font-size:22px;font-weight:600;color:#3d3d3d;background:rgba(255,255,255,.8);border-radius:6px;padding:2px 10px}.ctr{position:absolute;left:80px;right:80px;text-align:center}.btn{display:inline-block;margin-top:36px;padding:22px 90px;border-radius:44px;background:#2F6B45;color:#fff;font-size:34px;font-weight:800}
.c{background:#FFF4F2}
.ctr{top:80px}.ctr .sub{margin-top:24px}.ctr .head{margin-top:8px;color:#F05656}.ctr .body{margin-top:18px}
.price{position:absolute;left:330px;right:80px;top:470px;height:220px;background:#fff;border-radius:30px;display:flex;flex-direction:column;justify-content:center;padding:0 48px;box-shadow:0 12px 28px rgba(240,86,86,.1)}
.price .reg{font-size:30px;color:#888;text-decoration:line-through}.price .sale{margin-top:8px;font-size:52px;font-weight:900;color:#F05656}
.price .hole{font-size:28px;font-weight:700;color:#8a6d00;background:#FFF3BF;border:2px dashed #E0B400;border-radius:14px;padding:12px 18px;line-height:1.45}
.pack{left:100px;top:440px;height:300px}
.cta{position:absolute;left:0;right:0;top:740px;text-align:center}
</style><div class="c">
<div class="ctr"><span class="badge">{{badge}}</span><div class="sub">{{sub}}</div><div class="head">{{head}}</div><div class="body">{{body}}</div></div>
{{packs_html}}<div class="price">{{#price_sale}}<div class="reg">{{price_regular}}</div><div class="sale">{{price_sale}}</div>{{/price_sale}}{{^price_sale}}<div class="hole">[현행 판매가 입력] → [행사 적용가 또는 할인액 입력]<br>자사몰 계산 확인 후 입력</div>{{/price_sale}}</div>
<div class="cta"><span class="btn">{{button}}</span></div><div class="notice">{{notice}}</div></div></html>
