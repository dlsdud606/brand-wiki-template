<!-- 메타 릴스 끝 화면 9:16. 슬롯: badge, sub, head. 자산: pack. 안전 영역 안에만 글자 -->
<!doctype html><html lang="ko"><meta charset="utf-8"><title>{{id}}</title><style>
*{box-sizing:border-box}body{margin:0}
.c{position:relative;width:1080px;height:1920px;overflow:hidden;background:linear-gradient(180deg,#BFEAFB 0%,#D8F6FE 60%,#EAF9FF 100%);font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#1f1f1f;word-break:keep-all}
/* 메타 릴스 안전 영역: 위 14%(269px)·아래 35%(1248px 아래)·양옆 6%(65px)에는 글자·로고를 두지 않는다 */
.safe{position:absolute;left:65px;right:65px;top:269px;height:979px;text-align:center}
.badge{display:inline-block;margin-top:40px;color:#fff;font-weight:800;font-size:40px;padding:14px 36px;border-radius:16px;background:linear-gradient(90deg,#FE8536,#F05656)}
.sub{margin-top:30px;font-size:52px;font-weight:700}
.head{margin-top:6px;font-size:104px;font-weight:900;letter-spacing:-3px;color:#F05656}
.pack{position:absolute;left:50%;transform:translateX(-50%);top:640px;height:560px;filter:drop-shadow(0 20px 24px rgba(60,40,30,.22))}
.notice{position:absolute;right:80px;top:1205px;font-size:24px;color:rgba(40,40,40,.6)}
{{packs_css}}</style><div class="c"><div class="safe"><span class="badge">{{badge}}</span><div class="sub">{{sub}}</div><div class="head">{{head}}</div></div>
{{packs_html}}<div class="notice">{{notice}}</div></div></html>
