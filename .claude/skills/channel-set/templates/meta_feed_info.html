<!-- 메타 피드 4:5 · 원료·구성 중심. 슬롯: band, sub, head, cards(라벨|값 목록). 자산: pack -->
<!doctype html><html lang="ko"><meta charset="utf-8"><title>{{id}}</title><style>*{box-sizing:border-box}body{margin:0}.c{position:relative;width:1440px;height:1800px;overflow:hidden;font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#1f1f1f;word-break:keep-all}.badge{display:inline-block;color:#fff;font-weight:800;border-radius:18px;background:linear-gradient(90deg,#FE8536,#F05656)}.notice{position:absolute;right:56px;bottom:40px;font-size:26px;color:rgba(40,40,40,.55)}.pack{position:absolute;filter:drop-shadow(0 26px 30px rgba(60,40,30,.22))}.txt{position:absolute;left:0;right:0;text-align:center}
.c{background:#FFFFFF}
.band{position:absolute;left:0;right:0;top:0;height:120px;background:linear-gradient(90deg,#FE8536,#F05656);color:#fff;font-size:46px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:28px}
.txt{left:110px;right:auto;width:760px;text-align:left;top:250px}
.sub{font-size:56px;font-weight:600;color:#2b2b2b}
.head{margin-top:16px;font-size:88px;font-weight:900;letter-spacing:-2px;line-height:1.18}
.cards{position:absolute;left:110px;top:760px;width:600px;display:flex;flex-direction:column;gap:30px}
.card{border-radius:28px;background:#FFF4F2;padding:34px 40px}.card b{display:block;font-size:40px;color:#F05656}.card span{font-size:52px;font-weight:800}
.pack{right:80px;top:470px;height:1080px}
{{packs_css}}</style><div class="c"><div class="band">{{band}}</div>
<div class="txt"><div class="sub">{{sub}}</div><div class="head">{{head}}</div></div>
<div class="cards">{{cards_html}}</div>
{{packs_html}}<div class="notice">{{notice}}</div></div></html>
